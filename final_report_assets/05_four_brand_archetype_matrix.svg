<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<rect width="1800" height="1080" fill="#FCFBF8"/>
<style>
          .title { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:28px; font-weight:700; fill:#1F2933; }
          .subtitle { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:15px; fill:#5B6570; }
          .section { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:18px; font-weight:700; fill:#1F2933; }
          .label { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:14px; fill:#39424E; }
          .small { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:12px; fill:#65717C; }
          .note { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:12px; fill:#66727C; }
          .value { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:13px; font-weight:700; fill:#25313B; }
          .grid { stroke:#D8D5CF; stroke-width:1; }
          .axis { stroke:#8D959C; stroke-width:1.2; }
        </style>
<text x="56" y="52" class="title">四品牌价格架构原型与证据强度</text>
<text x="56" y="79" class="subtitle">分析性标签，不是品牌官方战略声明；历史结论按同款连续与 successor 路径区分。</text>
<rect x="50" y="135" width="150" height="58" fill="#26313B"/>
<text x="125.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">品牌</text>
<rect x="200" y="135" width="280" height="58" fill="#26313B"/>
<text x="340.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">观察到的进入门槛</text>
<rect x="480" y="135" width="330" height="58" fill="#26313B"/>
<text x="645.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">价格梯结构</text>
<rect x="810" y="135" width="300" height="58" fill="#26313B"/>
<text x="960.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">上端机制</text>
<rect x="1110" y="135" width="350" height="58" fill="#26313B"/>
<text x="1285.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">历史重定价证据</text>
<rect x="1460" y="135" width="290" height="58" fill="#26313B"/>
<text x="1605.0" y="171" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">主要限制</text>
<rect x="50" y="193" width="150" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<rect x="50" y="193" width="8" height="178" fill="#171717"/>
<text x="72" y="241" class="section">Chanel</text>
<rect x="200" y="193" width="280" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="216" y="227" class="label">高；</text>
<text x="216" y="257" class="label">FR €4,850 / US $5,400 起</text>
<rect x="480" y="193" width="330" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="496" y="227" class="label">lower/core 集群 → Classic/icon 明显跳升；</text>
<text x="496" y="257" class="label">中间数值观察较薄</text>
<rect x="810" y="193" width="300" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="826" y="227" class="label">Classic 11.12 / Small Classic 高锚点；</text>
<text x="826" y="257" class="label">部分 Classic 询价</text>
<rect x="1110" y="193" width="350" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="1126" y="227" class="label">France 4 条 SAME_MODEL_CONTINUOUS；</text>
<text x="1126" y="257" class="label">图标 +18.1%，access +16.5%；</text>
<text x="1126" y="287" class="label">绝对价差扩大</text>
<rect x="1460" y="193" width="290" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="1476" y="227" class="label">当前样本非全量；</text>
<text x="1476" y="257" class="label">历史主要为法国选定 lineages；</text>
<text x="1476" y="287" class="label">无 US 历史对照</text>
<rect x="50" y="371" width="150" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<rect x="50" y="371" width="8" height="178" fill="#B07A3D"/>
<text x="72" y="419" class="section">Louis Vuitton</text>
<rect x="200" y="371" width="280" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="216" y="405" class="label">低；</text>
<text x="216" y="435" class="label">FR €1,800 / US $1,950 起</text>
<rect x="480" y="371" width="330" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="496" y="405" class="label">较宽的 lower/core 可进入梯；</text>
<text x="496" y="435" class="label">观察重心偏低</text>
<rect x="810" y="371" width="300" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="826" y="405" class="label">当前样本未见数值 exceptional 层</text>
<rect x="1110" y="371" width="350" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="1126" y="405" class="label">四条 lineages 均有正向事件；</text>
<text x="1126" y="435" class="label">Speedy 20 / Neverfull 同款路径支持 broad repricing</text>
<rect x="1460" y="371" width="290" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="1476" y="405" class="label">Speedy / Alma successor 只能方向性解释；</text>
<text x="1476" y="435" class="label">FR 与 US 当前组合不同</text>
<rect x="50" y="549" width="150" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<rect x="50" y="549" width="8" height="178" fill="#7D2947"/>
<text x="72" y="597" class="section">Dior</text>
<rect x="200" y="549" width="280" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="216" y="583" class="label">中；</text>
<text x="216" y="613" class="label">FR €3,000 / US $3,600 起</text>
<rect x="480" y="549" width="330" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="496" y="583" class="label">压缩的 core / mid-premium 梯；</text>
<text x="496" y="613" class="label">法国数值观察集中在 core</text>
<rect x="810" y="549" width="300" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="826" y="583" class="label">当前样本没有数值 exceptional 层</text>
<rect x="1110" y="549" width="350" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="1126" y="583" class="label">3 条 lineages 全为 MODEL_SUCCESSOR；</text>
<text x="1126" y="613" class="label">排除当前锚点转移后事件更温和</text>
<rect x="1460" y="549" width="290" height="178" fill="#F4F1EB" stroke="#DDD9D1"/>
<text x="1476" y="583" class="label">US 仍有 7 条未解析；</text>
<text x="1476" y="613" class="label">材质 / 版本变化与涨价难分</text>
<rect x="50" y="727" width="150" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<rect x="50" y="727" width="8" height="178" fill="#8C4A24"/>
<text x="72" y="775" class="section">Hermès</text>
<rect x="200" y="727" width="280" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="216" y="761" class="label">有较低进入点；</text>
<text x="216" y="791" class="label">FR €2,170 / US $3,075 起</text>
<rect x="480" y="727" width="330" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="496" y="761" class="label">宽广、多系列，中间层与上尾变化较大</text>
<rect x="810" y="727" width="300" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="826" y="761" class="label">上端尾部更分散；</text>
<text x="826" y="791" class="label">US 进入 exceptional 观察</text>
<rect x="1110" y="727" width="350" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="1126" y="761" class="label">仅 Geta / Jypsière 两条产品线；</text>
<text x="1126" y="791" class="label">Geta France 存在来源冲突</text>
<rect x="1460" y="727" width="290" height="178" fill="#FCFBF8" stroke="#DDD9D1"/>
<text x="1476" y="761" class="label">历史不足以讲组合层面重定价；</text>
<text x="1476" y="791" class="label">无对称 icon 分类</text>
<text x="50" y="930" class="note">最强可比证据：Chanel France 选定同款连续历史、Louis Vuitton 部分同款连续历史；Dior 与 Hermès 主要承担方向性或当前结构比较。</text>
<text x="50" y="956" class="note">主读法：四个品牌并非同一种“奢侈品涨价”模型；当前梯形与历史路径的组合，决定了不同的竞争重叠区间。</text>
<text x="50" y="982" class="note">边界：所有结论均为公开标价样本的外部观察，不推断管理层意图，也不推断需求、支付意愿或利润。</text>
</svg>