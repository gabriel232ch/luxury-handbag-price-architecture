<rect x="1190" y="180" width="330" height="250" rx="10" fill="#F1EEE8" stroke="#D8D5CF"/>
<text x="1220" y="220" class="section">结论</text>
<text x="1220" y="257" class="label">图标中位数：+18.1%</text>
<text x="1220" y="289" class="label">Mini/access 中位数：+16.5%</text>
<text x="1220" y="321" class="label">比例：2.05× → 2.08×</text>
<text x="1220" y="353" class="label">绝对价差：€4,470 → €5,350</text>
<text x="1220" y="385" class="label">两组价格都上移；图标仅适度领先。</text>
<text x="140" y="700" class="note">解释：这支持“广泛重定价 + 持续的高图标锚点”，而不是“只有图标产品大幅涨价”。</text>
<text x="140" y="726" class="note">方法注：使用 common observed years，不插值；历史非当前观察主要来自已登记的专业二手历史价格表，2026 端点来自官方当前页面。</text>
<text x="140" y="752" class="note">来源：historical_pricing_calculations/icon_core_evolution.csv；选定 Chanel France lineages：CH-C01、CH-C02、CH-C03、CH-C04。</text>
