<style>
          .title { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:28px; font-weight:700; fill:#1F2933; }
          .subtitle { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:15px; fill:#5B6570; }
          .section { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:18px; font-weight:700; fill:#1F2933; }
          .label { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:13px; fill:#39424E; }
          .small { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:12px; fill:#65717C; }
          .note { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:12px; fill:#66727C; }
          .value { font-family:'Noto Sans CJK SC','PingFang SC','Heiti SC','Arial',sans-serif; font-size:13px; font-weight:700; fill:#25313B; }
