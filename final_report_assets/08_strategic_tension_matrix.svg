<text x="56" y="52" class="title">Strategic tensions: what the evidence supports</text>
<text x="56" y="79" class="subtitle">Evidence-backed tensions for management attention; the final column is an implication / validation agenda, not a causal prescription.</text>
<text x="60" y="135" class="section">Tension</text>
<text x="350" y="135" class="section">Observed evidence</text>
<text x="740" y="135" class="section">Boundary / not proven</text>
<text x="1110" y="135" class="section">Strategic implication</text>
<rect x="48" y="156" width="1504" height="132" rx="8" fill="#F1EEE8" stroke="#E0DDD5"/>
<text x="60" y="190" class="label">
<tspan x="60" dy="0">Exclusivity vs Recruitment</tspan>
</text>
<text x="350" y="190" class="label">
<tspan x="350" dy="0">Visible entry threshold is elevated</tspan>
</text>
<text x="740" y="190" class="label">
<tspan x="740" dy="0">Conversion / entry barrier effect is</tspan>
<tspan x="740" dy="22">not observed</tspan>
</text>
<text x="1110" y="190" class="label">
<tspan x="1110" dy="0">Monitor entry coverage with internal client and</tspan>
<tspan x="1110" dy="22">migration data</tspan>
</text>
<rect x="48" y="316" width="1504" height="132" rx="8" fill="#FCFBF8" stroke="#E0DDD5"/>
<text x="60" y="350" class="label">
<tspan x="60" dy="0">Icon Monetization vs Ladder</tspan>
<tspan x="60" dy="22">Continuity</tspan>
</text>
<text x="350" y="350" class="label">
<tspan x="350" dy="0">Classic / icon sits above a large visible</tspan>
<tspan x="350" dy="22">step</tspan>
</text>
<text x="740" y="350" class="label">
<tspan x="740" dy="0">Portfolio continuity risk is a</tspan>
<tspan x="740" dy="22">question, not a finding</tspan>
</text>
<text x="1110" y="350" class="label">
<tspan x="1110" dy="0">Manage the whole ladder, not only the anchor</tspan>
</text>
<rect x="48" y="476" width="1504" height="132" rx="8" fill="#F1EEE8" stroke="#E0DDD5"/>
<text x="60" y="510" class="label">
<tspan x="60" dy="0">Broad Repricing vs Competitive</tspan>
<tspan x="60" dy="22">Substitution</tspan>
</text>
<text x="350" y="510" class="label">
<tspan x="350" dy="0">Lower/core tiers overlap different</tspan>
<tspan x="350" dy="22">competitor battlegrounds</tspan>
</text>
<text x="740" y="510" class="label">
<tspan x="740" dy="0">Substitution cannot be inferred from</tspan>
<tspan x="740" dy="22">list prices</tspan>
</text>
<text x="1110" y="510" class="label">
<tspan x="1110" dy="0">Benchmark by tier and market</tspan>
</text>
<rect x="48" y="636" width="1504" height="132" rx="8" fill="#FCFBF8" stroke="#E0DDD5"/>
<text x="60" y="670" class="label">
<tspan x="60" dy="0">Premiumization vs Growth</tspan>
<tspan x="60" dy="22">Quality</tspan>
</text>
<text x="350" y="670" class="label">
<tspan x="350" dy="0">Prices persist while 2024 consolidated</tspan>
<tspan x="350" dy="22">performance weakened</tspan>
</text>
<text x="740" y="670" class="label">
<tspan x="740" dy="0">Cycle, mix, region, FX and investment</tspan>
<tspan x="740" dy="22">confound interpretation</tspan>
</text>
<text x="1110" y="670" class="label">
<tspan x="1110" dy="0">Evaluate price with growth quality and cash</tspan>
</text>
<rect x="48" y="796" width="1504" height="132" rx="8" fill="#F1EEE8" stroke="#E0DDD5"/>
<text x="60" y="830" class="label">
<tspan x="60" dy="0">Price Elevation vs</tspan>
<tspan x="60" dy="22">Reinvestment</tspan>
</text>
<text x="350" y="830" class="label">
<tspan x="350" dy="0">Brand support and capex remain material;</tspan>
<tspan x="350" dy="22">2024 capex was a record</tspan>
</text>
<text x="740" y="830" class="label">
<tspan x="740" dy="0">Investment is company-wide and not</tspan>
<tspan x="740" dy="22">handbag causal proof</tspan>
</text>
<text x="1110" y="830" class="label">
<tspan x="1110" dy="0">Treat desirability, experience, craftsmanship</tspan>
<tspan x="1110" dy="22">and cash as a linked management agenda</tspan>
</text>
<line x1="56" y1="960" x2="1544" y2="960" stroke="#D8D5CF"/>
<text x="56" y="990" class="note">证据边界：价格架构与经营数据可以共同支持战略张力；客户转化、需求弹性、销量、产品利润与 migration 需要 Chanel 内部数据。</text>
<text x="56" y="1014" class="note">来源：现有 price architecture / historical panels + official Chanel, Hermès and LVMH financial sources in the structured registry。</text>
</svg>